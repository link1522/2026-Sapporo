<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, nosnippet">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>2026 北海道札幌之旅</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=32">
  <script src="data.enc.js" defer></script>
  <script src="app.js?v=32" defer></script>
</head>
<body>
  <main id="unlock" class="unlock">
    <div class="unlock-panel">
      <img class="lock-icon" src="icon.svg" alt="" aria-hidden="true">
      <h1>請輸入密碼</h1>
      <form id="unlock-form" hidden>
        <label for="passphrase">密碼</label>
        <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required>
        <button type="submit">確認</button>
      </form>
      <p id="unlock-message" class="unlock-message" role="status" aria-live="polite">正在開啟…</p>
    </div>
  </main>
  <div id="app" hidden></div>
</body>
</html>
